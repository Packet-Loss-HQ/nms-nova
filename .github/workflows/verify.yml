name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python -m py_compile main.py scripts/*.py state/*.py probes/*.py tests/test_functional.py
      - run: mkdir -p secrets state backups
      - run: .venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "App started"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start"
          tail -n 200 /tmp/uvicorn.log || true
          exit 1
      - run: NMS_BASE_URL=http://127.0.0.1:8000 NMS_DB=/tmp/nms-nova-test.db .venv/bin/python -m pytest tests/test_functional.py -q
      - run: pkill -f "uvicorn main:app" || true
