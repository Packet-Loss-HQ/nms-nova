targets:
  - name: host-a
    kind: ssh
    address: 10.0.0.1
    probe_type: ssh
    tier: T1
    ssh_key: /opt/nms-nova/secrets/probe-key
    metrics:
      - name: cpu_usage_percent
        interval_sec: 30
      - name: memory_used_percent
        interval_sec: 30
      - name: disk_root_used_percent
        interval_sec: 60
      - name: service_up
        interval_sec: 30
        service_name: service-a.service
      - name: interface_total_kbps
        interval_sec: 30
        interface: eth0

